<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3f6fb" />
  <title>Brickhouse Weekly Workouts</title>

  <!-- External stylesheet (cache-busted) -->
  <link rel="stylesheet" href="css/styles.css?v=20260221">
</head>

<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>Brickhouse Weekly Workouts</h1>
        <p class="sub">Tap a day → train with intent.</p>
      </div>
      <div class="hdrRight">
        <div class="chip"><span id="chipText">Pick a day</span></div>
        <button id="themeToggle" aria-label="Toggle theme">🌙</button>
      </div>
    </header>

    <section class="quote">
      <p id="quoteText">Loading quote…</p>
      <small id="quoteSrc"></small>
    </section>

    <main class="view active" id="view-week">
      <div class="grid" id="weekGrid"></div>
      <div class="foot">Add to Home Screen for app mode.</div>
    </main>

    <main class="view" id="view-day">
      <div class="topbar">
        <button class="backBtn" id="backBtn">← Back</button>
        <div class="dayTitle">
          <h2 id="dayName"></h2>
          <p id="dayFocus"></p>
        </div>
        <div class="timerBar">
          <span class="timerText" id="timerText">⏱ 00:00</span>
          <button class="timerBtn" id="timerToggleBtn">Pause</button>
        </div>
      </div>

      <div class="cards" id="dayCards"></div>
      <div class="foot">Stay on the reps. Win the day.</div>
    </main>
  </div>

  <!-- App script (cache-busted) -->
  <script src="js/app.js?v=20260221"></script>
</body>
</html>
